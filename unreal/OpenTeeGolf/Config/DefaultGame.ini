ProjectVersion=0.23.0
Description=OpenTeeGolf: golf on real courses with your launch monitor
ProjectDisplayedTitle=NSLOCTEXT("[/Script/EngineSettings]", "Title", "OpenTeeGolf")

[/Script/UnrealEd.ProjectPackagingSettings]
; the game and its scenery in pieces (pakchunk0..5: make_game_assets.py's labels - 5 is KiteDemo's), each under 2 GB
bGenerateChunks=True
bShareMaterialShaderCode=True
bUseIoStore=True
; the ball, flag and markers (loaded by path)
+DirectoriesToAlwaysCook=(Path="/Engine/BasicShapes")
; the game's own assets (make_game_assets.py)
+DirectoriesToAlwaysCook=(Path="/Game/OpenTeeGolf/Game")
; the sky, time of day and weather (the Meridian Sky plugin: OTGSky.cpp) and the rough's grass mats
; (the Greensward plugin: OTGGrass.cpp - its mats and materials, not its demo map, markings or PCG graphs)
+DirectoriesToAlwaysCook=(Path="/MeridianSky")
+DirectoriesToAlwaysCook=(Path="/Greensward/Mats")
+DirectoriesToAlwaysCook=(Path="/Greensward/Materials")
; the ponds, lakes, rivers and sea (the Tidewright Water plugin: OTGWater.cpp - not its demo map)
+DirectoriesToAlwaysCook=(Path="/Tidewright/Materials")
+DirectoriesToAlwaysCook=(Path="/Tidewright/Presets")
+DirectoriesToAlwaysCook=(Path="/Tidewright/Shared")
+DirectoriesToAlwaysCook=(Path="/Tidewright/Textures")
; the houses round the course (the Hearthline Homes plugin: OTGHouses.cpp - its materials and textures, not its demo map or demo houses)
+DirectoriesToAlwaysCook=(Path="/HearthlineHomes/Materials")
+DirectoriesToAlwaysCook=(Path="/HearthlineHomes/Textures")
; the scenery exported courses are built with at run time (OTGRuntimeCourse.cpp): the trees
+DirectoriesToAlwaysCook=(Path="/Game/EuropeanBeech/Geometry/SimpleWind")
+DirectoriesToAlwaysCook=(Path="/Game/EuropeanHornbeam/Geometry/SimpleWind")
; (the Megaplant spruce and pine: only their SM_ meshes and what those use, which OTG_Chunk3 names -
; make_game_assets.py - not the folders, whose skeletal trees and branches are only for editing)
; the Megascans grasses from Fab (OTGGrass.cpp: the rough's tufts, the fescue and meadow grass)
+DirectoriesToAlwaysCook=(Path="/Game/Fab/Megascans/Plants")
; KiteDemo's (OTGKiteDemo.h): its heather and wildflowers, Scots pine and hill oak, and rocks - only these
; of the pack (its ground tiles and cliffs aren't used)
+DirectoriesToAlwaysCook=(Path="/Game/KiteDemo/Environments/Foliage/Flowers/Heather")
+DirectoriesToAlwaysCook=(Path="/Game/KiteDemo/Environments/Foliage/Flowers/Yarrow")
+DirectoriesToAlwaysCook=(Path="/Game/KiteDemo/Environments/Foliage/Flowers/Buttercup")
